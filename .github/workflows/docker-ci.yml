name: unison-io-core Docker CI (build-only)

on:
  pull_request:
    paths:
      - '**/*.py'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/docker-ci.yml'
  push:
    branches: [ main ]
    paths:
      - '**/*.py'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/docker-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ghcr.io/project-unisonos/unison-io-core:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

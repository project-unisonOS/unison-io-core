name: Publish container

on:
  push:
    branches: [ main, "release/**" ]
    tags: [ "v*" ]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    uses: project-unisonOS/unison-platform/.github/workflows/reusable-build.yml@e666326fcf872c7507a03a881e01c0ce24fa6ec7
    with:
      image_name: unison-io-core
      domain: io-core
      service_port: "8085"
    secrets: inherit
